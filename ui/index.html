<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workbook + ChatGPT Loop</title>
    <style>
      :root {
        --bg: #f4efe6;
        --panel: #fffaf0;
        --ink: #1f2933;
        --muted: #6b7280;
        --line: #d8cfc0;
        --accent: #b45309;
        --accent-strong: #92400e;
        --danger: #b91c1c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "SF Pro Text", "PingFang SC", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(180, 83, 9, 0.12), transparent 28%),
          linear-gradient(180deg, #fbf7f1 0%, var(--bg) 100%);
        color: var(--ink);
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
      }

      .lead {
        margin: 0 0 24px;
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
      }

      .panel {
        background: color-mix(in srgb, var(--panel) 92%, white);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(31, 41, 51, 0.06);
      }

      .panel h2 {
        margin: 0 0 14px;
        font-size: 18px;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .panel-header h2 {
        margin: 0;
      }

      label {
        display: block;
        margin-bottom: 12px;
        font-size: 14px;
        color: var(--muted);
      }

      input, select {
        width: 100%;
        margin-top: 6px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 15px;
        background: #fff;
        color: var(--ink);
      }

      input[readonly] {
        background: #f9f6ef;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 18px;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 11px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .primary {
        background: var(--accent);
        color: white;
      }

      .secondary {
        background: white;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      .danger {
        background: #fff1f2;
        color: var(--danger);
        border: 1px solid #fecdd3;
      }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border-radius: 12px;
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
        transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      }

      .icon-btn:hover {
        background: #f8f3ea;
        border-color: color-mix(in srgb, var(--accent) 38%, var(--line));
        transform: translateY(-1px);
      }

      .icon-btn:active {
        transform: translateY(0);
      }

      .icon-btn:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--accent) 55%, white);
        outline-offset: 2px;
      }

      .icon-btn svg {
        width: 18px;
        height: 18px;
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
      }

      .stat {
        padding: 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid var(--line);
      }

      .stat strong {
        display: block;
        font-size: 24px;
        margin-bottom: 4px;
      }

      .hint, .warning {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 14px;
      }

      .hint {
        background: #fff7ed;
        color: var(--accent-strong);
      }

      .warning {
        background: #fff1f2;
        color: var(--danger);
      }

      pre {
        margin: 0;
        background: #241c16;
        color: #f9f4ed;
        border-radius: 14px;
        padding: 16px;
        min-height: 260px;
        max-height: 420px;
        overflow: auto;
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Workbook + ChatGPT Loop</h1>
      <p class="lead">首次先在终端运行一次 <code>npm run bootstrap</code> 绑定 ChatGPT project，之后日常直接 <code>npm start</code> 即可。</p>

      <div class="grid">
        <section class="panel">
          <h2>文件</h2>
          <label>
            Workbook Path
            <input id="workbookPath" type="text" placeholder="可点“选择文件”，也可直接粘贴 Excel 路径">
          </label>
          <label>
            Sheet
            <select id="sheetName"></select>
          </label>
          <div class="actions">
            <button class="secondary" id="choose-file-btn" type="button">选择文件</button>
            <button class="primary" id="save-btn" type="button">保存配置</button>
          </div>
          <div class="hint">如果 Windows 文件弹窗没有正常返回，可以直接把 `.xlsx` 或 `.xlsm` 的完整路径粘贴到上面的输入框，再点“保存配置”。</div>
          <div class="hint" id="message">加载中…</div>
          <div class="warning" id="warning" hidden></div>
        </section>

        <section class="panel">
          <h2>参数</h2>
          <form id="config-form">
            <label>
              batchSize
              <input id="batchSize" name="batchSize" type="number" min="1">
            </label>
            <label>
              resetConversationEveryRuns
              <input id="resetConversationEveryRuns" name="resetConversationEveryRuns" type="number" min="1">
            </label>
            <label>
              newConversationLimit
              <input id="newConversationLimit" name="newConversationLimit" type="number" min="0">
            </label>
            <label>
              startRow
              <input id="startRow" name="startRow" type="number" min="1">
            </label>
            <label>
              sourceColumn
              <input id="sourceColumn" name="sourceColumn" type="text" maxlength="4">
            </label>
            <label>
              targetColumn
              <input id="targetColumn" name="targetColumn" type="text" maxlength="4">
            </label>
          </form>
          <div class="actions">
            <button class="primary" id="apply-btn" type="button">确认参数</button>
            <button class="secondary" id="run-btn" type="button">开始任务</button>
            <button class="danger" id="stop-btn" type="button">停止任务</button>
          </div>
        </section>

        <section class="panel">
          <h2>概览</h2>
          <div class="meta">
            <div class="stat">
              <strong id="total-conversations">0</strong>
              <span>总对话窗口数</span>
            </div>
            <div class="stat">
              <strong id="total-runs">0</strong>
              <span>总循环次数</span>
            </div>
            <div class="stat">
              <strong id="total-rows">0</strong>
              <span>理论总行数</span>
            </div>
            <div class="stat">
              <strong id="next-row">按配置</strong>
              <span>当前起始行</span>
            </div>
          </div>
          <div class="hint">
            跑脚本时，最好不要同时在 WPS 里打开同一个文件，避免保存冲突。
          </div>
          <div class="hint" id="applied-summary">当前还没有确认参数。</div>
        </section>
      </div>

      <section class="panel" style="margin-top: 16px;">
        <div class="panel-header">
          <h2>运行日志</h2>
          <button
            class="icon-btn"
            id="copy-log-btn"
            type="button"
            title="复制日志"
            aria-label="复制运行日志"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.8"></rect>
              <path d="M7 15H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            </svg>
          </button>
        </div>
        <pre id="log"></pre>
      </section>
    </div>

    <script>
      const fields = ["batchSize", "resetConversationEveryRuns", "newConversationLimit", "startRow", "sourceColumn", "targetColumn"];
      const messageEl = document.getElementById("message");
      const warningEl = document.getElementById("warning");
      const logEl = document.getElementById("log");
      const copyLogBtn = document.getElementById("copy-log-btn");
      const workbookPathEl = document.getElementById("workbookPath");
      const sheetNameEl = document.getElementById("sheetName");
      const appliedSummaryEl = document.getElementById("applied-summary");

      async function fetchJson(url, options) {
        const response = await fetch(url, {
          headers: { "Content-Type": "application/json" },
          ...options
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Request failed.");
        }
        return data;
      }

      function setMessage(text) {
        messageEl.textContent = text;
      }

      function setWarning(text) {
        warningEl.hidden = !text;
        warningEl.textContent = text || "";
      }

      function describeWriteCheck(writeCheck) {
        if (!writeCheck || writeCheck.ok) {
          return "";
        }

        switch (writeCheck.code) {
          case "READ_ONLY_ATTRIBUTE":
            return "当前目标 Excel 文件被标记为 read-only，请先关闭只读属性再运行。";
          case "LOCKED_FOR_UPDATE":
            return "当前目标 Excel 似乎正被 Excel/WPS 以只读或占用状态打开，请先关闭该文件的 read-only/只读占用后再运行。";
          case "NO_WRITE_ACCESS":
            return "当前目标 Excel 没有写权限，请先检查文件权限后再运行。";
          case "NO_DIRECTORY_WRITE_ACCESS":
            return "当前 Excel 所在目录不可写，程序无法生成临时文件后再覆盖原文件。";
          default:
            return writeCheck.detail
              ? `目标 Excel 写入预检查失败：${writeCheck.detail}`
              : "目标 Excel 写入预检查失败，请确认文件不是只读或被占用。";
        }
      }

      async function copyText(text) {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return;
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "true");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand("copy");
        textarea.remove();
        if (!copied) {
          throw new Error("浏览器拒绝了复制请求");
        }
      }

      function flashCopyButton(text) {
        copyLogBtn.title = text;
        copyLogBtn.setAttribute("aria-label", text);
        clearTimeout(flashCopyButton.timer);
        flashCopyButton.timer = window.setTimeout(() => {
          copyLogBtn.title = "复制日志";
          copyLogBtn.setAttribute("aria-label", "复制运行日志");
        }, 1500);
      }

      function isLogPinnedToBottom() {
        const distanceFromBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight;
        return distanceFromBottom < 24;
      }

      function fillWorkflow(config) {
        const workflow = config.workflow;
        for (const name of fields) {
          document.getElementById(name).value = workflow[name];
        }
      }

      function fillWorkbook(config, workbookInfo) {
        workbookPathEl.value = config.workbook.filePath || "";
        const currentSheet = config.workbook.sheetName || workbookInfo?.activeSheetName || "";
        const sheetNames = workbookInfo?.sheetNames || [];

        sheetNameEl.innerHTML = "";
        if (sheetNames.length === 0) {
          const option = document.createElement("option");
          option.value = "";
          option.textContent = "先选择文件";
          sheetNameEl.appendChild(option);
          return;
        }

        for (const sheetName of sheetNames) {
          const option = document.createElement("option");
          option.value = sheetName;
          option.textContent = sheetName;
          option.selected = sheetName === currentSheet;
          sheetNameEl.appendChild(option);
        }
      }

      function readForm() {
        return {
          workbook: {
            filePath: workbookPathEl.value.trim(),
            sheetName: sheetNameEl.value
          },
          workflow: {
            batchSize: Number(document.getElementById("batchSize").value),
            resetConversationEveryRuns: Number(document.getElementById("resetConversationEveryRuns").value),
            newConversationLimit: Number(document.getElementById("newConversationLimit").value),
            startRow: Number(document.getElementById("startRow").value),
            sourceColumn: document.getElementById("sourceColumn").value.trim().toUpperCase(),
            targetColumn: document.getElementById("targetColumn").value.trim().toUpperCase()
          }
        };
      }

      function renderDerived(derived, status, config, writeCheck) {
        document.getElementById("total-conversations").textContent = derived.totalConversations;
        document.getElementById("total-runs").textContent = derived.totalRuns;
        document.getElementById("total-rows").textContent = derived.totalRows;
        document.getElementById("next-row").textContent = document.getElementById("startRow").value || "-";
        const nextLogText = (status.logLines || []).join("\n");
        if (nextLogText !== logEl.textContent) {
          const shouldStickToBottom = isLogPinnedToBottom();
          logEl.textContent = nextLogText;
          if (shouldStickToBottom) {
            logEl.scrollTop = logEl.scrollHeight;
          }
        }
        if (config) {
          const workflow = config.workflow;
          const workbook = config.workbook;
          appliedSummaryEl.textContent =
            `已确认参数：${workflow.sourceColumn} -> ${workflow.targetColumn}，起始行 ${workflow.startRow}，每批 ${workflow.batchSize} 行，每个对话 ${workflow.resetConversationEveryRuns} 轮，新对话上限 ${workflow.newConversationLimit}，工作表 ${workbook.sheetName || "未选"}。`;
        }

        const warnings = [];
        if (status.missingBootstrap) {
          warnings.push("还没完成 bootstrap。请先在终端运行 npm run bootstrap 一次。");
        }
        if (status.missingWorkbook) {
          warnings.push("还没选择工作簿文件。");
        }
        const writeWarning = describeWriteCheck(writeCheck);
        if (writeWarning) {
          warnings.push(writeWarning);
        }
        setWarning(warnings.join(" "));
      }

      async function refresh() {
        const data = await fetchJson("/api/config");
        fillWorkflow(data.config);
        fillWorkbook(data.config, data.workbookInfo);
        renderDerived(data.derived, data.status || {}, data.config, data.writeCheck);
        setMessage(data.status && data.status.running ? "任务运行中" : "配置已加载");
      }

      document.getElementById("choose-file-btn").addEventListener("click", async () => {
        try {
          const data = await fetchJson("/api/choose-file", { method: "POST" });
          fillWorkflow(data.config);
          fillWorkbook(data.config, data.workbookInfo);
          renderDerived(data.derived, data.status || {}, data.config, data.writeCheck);
          setMessage("文件已选择");
        } catch (error) {
          setWarning(error.message);
        }
      });

      document.getElementById("save-btn").addEventListener("click", async () => {
        try {
          const data = await fetchJson("/api/config", {
            method: "POST",
            body: JSON.stringify(readForm())
          });
          fillWorkbook(data.config, data.workbookInfo);
          renderDerived(data.derived, data.status || {}, data.config, data.writeCheck);
          setMessage("配置已保存");
        } catch (error) {
          setWarning(error.message);
        }
      });

      document.getElementById("apply-btn").addEventListener("click", async () => {
        try {
          const data = await fetchJson("/api/config", {
            method: "POST",
            body: JSON.stringify(readForm())
          });
          fillWorkflow(data.config);
          fillWorkbook(data.config, data.workbookInfo);
          renderDerived(data.derived, data.status || {}, data.config, data.writeCheck);
          setMessage("参数已确认并已应用");
        } catch (error) {
          setWarning(error.message);
        }
      });

      document.getElementById("run-btn").addEventListener("click", async () => {
        try {
          const saved = await fetchJson("/api/config", {
            method: "POST",
            body: JSON.stringify(readForm())
          });
          fillWorkflow(saved.config);
          fillWorkbook(saved.config, saved.workbookInfo);
          renderDerived(saved.derived, saved.status || {}, saved.config, saved.writeCheck);
          await fetchJson("/api/run", { method: "POST" });
          setMessage("任务已启动");
          await refreshStatusOnly();
        } catch (error) {
          setWarning(error.message);
        }
      });

      document.getElementById("stop-btn").addEventListener("click", async () => {
        await fetchJson("/api/stop", { method: "POST" });
        setMessage("已请求停止");
      });

      copyLogBtn.addEventListener("click", async () => {
        const text = logEl.textContent || "";
        if (!text.trim()) {
          setWarning("当前还没有可复制的日志。");
          flashCopyButton("暂无日志");
          return;
        }

        try {
          await copyText(text);
          setMessage("运行日志已复制到剪贴板");
          flashCopyButton("已复制");
        } catch (error) {
          setWarning(`复制日志失败：${error.message}`);
          flashCopyButton("复制失败");
        }
      });

      async function refreshStatusOnly() {
        const data = await fetchJson("/api/status");
        const configData = await fetchJson("/api/config");
        renderDerived(data.derived, data.status || {}, configData.config, configData.writeCheck || data.writeCheck);
      }

      refresh().catch((error) => setWarning(error.message));
      setInterval(() => {
        refreshStatusOnly().catch((error) => setWarning(error.message));
      }, 2000);
    </script>
  </body>
</html>
